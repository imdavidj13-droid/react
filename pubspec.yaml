name: react
description: A fast phone-native reaction game built with Flutter and Flame.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.32.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  share_plus: ^13.3.0
  cross_file: ^0.3.5+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
