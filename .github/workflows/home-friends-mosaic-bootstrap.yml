name: Home Friends Mosaic Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-branch:
    if: ${{ github.head_ref == 'home-friends-mosaic-fixes' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: home-friends-mosaic-fixes

      - name: Apply requested fixes once
        run: |
          if [ "$(git log -1 --pretty=%s)" = "Apply home Friends and Mosaic fixes" ]; then
            echo "Patch already applied."
            exit 0
          fi
          python tooling/home_friends_mosaic_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app/react_app.dart lib/features/home/presentation/home_screen.dart lib/features/friends/presentation/friends_screen.dart lib/features/modes/presentation/mosaic_pressure_run_screen.dart test/home_friends_mosaic_regression_test.dart
          git diff --cached --check
          git commit -m "Apply home Friends and Mosaic fixes"
          git push origin HEAD:home-friends-mosaic-fixes
