name: Apply REACT polish batch

on:
  push:
    paths:
      - '.github/react-polish-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Correct patch targets
        run: python3 tool/fix_polish_patcher.py

      - name: Apply exact polish patch
        run: python3 tool/apply_polish_batch.py

      - name: Apply Daily share post-patch
        run: python3 tool/post_polish_patch.py

      - name: Format touched files
        run: |
          dart format \
            lib/features/gameplay/data/local_player_stats.dart \
            lib/features/gameplay/domain/react_run_history_entry.dart \
            lib/features/gameplay/domain/react_run_result.dart \
            lib/features/gameplay/presentation/react_run_screen.dart \
            lib/features/daily/presentation/daily_run_screen.dart \
            lib/features/daily/presentation/daily_screen.dart \
            lib/features/results/presentation/results_screen.dart \
            lib/features/results/presentation/result_share_screen.dart \
            lib/features/leaderboard/presentation/leaderboard_screen.dart \
            lib/features/leaderboard/presentation/personal_records_screen.dart \
            lib/features/settings/presentation/milestones_screen.dart \
            test/polish_batch_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit verified batch
        run: |
          rm -f .github/react-polish-trigger tool/apply_polish_batch.py tool/fix_polish_patcher.py tool/post_polish_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement REACT polish and records batch"
          git push origin main
