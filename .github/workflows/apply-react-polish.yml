name: Apply REACT polish batch

on:
  push:
    paths:
      - '.github/react-polish-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Correct patch targets
        run: python3 tool/fix_polish_patcher.py

      - name: Apply exact polish patch
        run: python3 tool/apply_polish_batch.py

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit verified batch
        run: |
          rm -f .github/react-polish-trigger tool/apply_polish_batch.py tool/fix_polish_patcher.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement REACT polish and records batch"
          git push origin main
