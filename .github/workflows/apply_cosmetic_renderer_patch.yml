name: Apply cosmetic renderer patch

on:
  push:
    branches:
      - seasonal-battle-pass
    paths:
      - .github/scripts/apply_cosmetic_renderer_patch.py
      - .github/workflows/apply_cosmetic_renderer_patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: seasonal-battle-pass
          fetch-depth: 0
      - name: Apply exact renderer edits
        run: python .github/scripts/apply_cosmetic_renderer_patch.py
      - name: Commit renderer edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/gameplay/presentation/react_run_screen.dart \
                  lib/features/daily/presentation/daily_run_screen.dart \
                  lib/features/dot_sequence/presentation/dot_sequence_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "Connect Arena and HUD cosmetics across gameplay"
          git push origin HEAD:seasonal-battle-pass
