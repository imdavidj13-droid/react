name: Mode Lab Audio Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-audio-branch:
    if: ${{ github.head_ref == 'mode-lab-audio-pass' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: mode-lab-audio-pass

      - name: Apply patch once
        run: |
          if [ "$(git log -1 --pretty=%s)" = "Wire Mode Lab audio feedback" ]; then
            echo "Audio patch already applied."
            exit 0
          fi
          python tooling/mode_lab_audio_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/modes/presentation test/mode_lab_audio_wiring_test.dart
          git diff --cached --check
          git commit -m "Wire Mode Lab audio feedback"
          git push origin HEAD:mode-lab-audio-pass
