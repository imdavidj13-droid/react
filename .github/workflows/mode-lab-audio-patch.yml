name: Mode Lab Audio Patch

on:
  push:
    branches:
      - mode-lab-audio-pass
    paths:
      - .github/workflows/mode-lab-audio-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Remove temporary Mode Lab audio patch workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Mode Lab audio wiring
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:90]!r}')
              p.write_text(text.replace(old, new, 1))

          wave = 'lib/features/modes/presentation/wave_two_variant_run_screen.dart'
          replace_once(
              wave,
              "import 'package:flutter/material.dart';\n\nimport '../../../core/theme/react_colors.dart';",
              "import 'package:flutter/material.dart';\n\nimport '../../../core/audio/react_audio.dart';\nimport '../../../core/theme/react_colors.dart';",
          )
          replace_once(
              wave,
              "  void _startCountdown() {\n    _countdownTimer = Timer.periodic(const Duration(milliseconds: 650), (_) {\n      if (!mounted || _finished) return;\n      if (_countdown > 1) {\n        setState(() => _countdown -= 1);\n      } else if (!_go) {\n        setState(() => _go = true);\n      } else {\n        _countdownTimer?.cancel();\n        _begin();\n      }\n    });\n  }",
              "  void _startCountdown() {\n    unawaited(ReactAudio.play(ReactSoundCue.countdownTick));\n    _countdownTimer = Timer.periodic(const Duration(milliseconds: 650), (_) {\n      if (!mounted || _finished) return;\n      if (_countdown > 1) {\n        setState(() => _countdown -= 1);\n        unawaited(ReactAudio.play(ReactSoundCue.countdownTick));\n      } else if (!_go) {\n        setState(() => _go = true);\n        unawaited(ReactAudio.play(ReactSoundCue.countdownGo));\n      } else {\n        _countdownTimer?.cancel();\n        _begin();\n      }\n    });\n  }",
          )
          replace_once(
              wave,
              "    if (mode == ReactVariantMode.sparkgrid) {\n      _clock.stop();\n      setState(() => _accepting = true);\n      return;\n    }\n    _clock\n      ..reset()\n      ..start();\n    setState(() => _accepting = true);",
              "    if (mode == ReactVariantMode.sparkgrid) {\n      _clock.stop();\n      setState(() => _accepting = true);\n      unawaited(ReactAudio.play(ReactSoundCue.command));\n      return;\n    }\n    _clock\n      ..reset()\n      ..start();\n    setState(() => _accepting = true);\n    unawaited(ReactAudio.play(ReactSoundCue.command));",
          )
          replace_once(
              wave,
              "    _accepting = false;\n    _score += points;\n\n    if (mode == ReactVariantMode.crucible)",
              "    _accepting = false;\n    _score += points;\n    unawaited(ReactAudio.play(ReactSoundCue.success));\n\n    if (mode == ReactVariantMode.crucible)",
          )
          replace_once(
              wave,
              "    _accepting = false;\n    if (loseLife) _lives -= 1;\n    if (mode == ReactVariantMode.thruster)",
              "    _accepting = false;\n    if (loseLife) _lives -= 1;\n    unawaited(\n      ReactAudio.play(loseLife ? ReactSoundCue.lifeLost : ReactSoundCue.miss),\n    );\n    if (mode == ReactVariantMode.thruster)",
          )
          replace_once(
              wave,
              "    _phaseTimer?.cancel();\n    _clock.stop();\n    final best = await LocalVariantModeStats.record(mode, _score);",
              "    _phaseTimer?.cancel();\n    _clock.stop();\n    unawaited(ReactAudio.play(ReactSoundCue.completed));\n    final best = await LocalVariantModeStats.record(mode, _score);",
          )
          replace_once(
              wave,
              "        _gridCharge[index] = 0;\n        _score += points;\n        _feedback = '+$points DISCHARGE';",
              "        _gridCharge[index] = 0;\n        _score += points;\n        _feedback = '+$points DISCHARGE';\n        unawaited(ReactAudio.play(ReactSoundCue.success));",
          )
          replace_once(
              wave,
              "      } else {\n        _lives -= 1;\n        _feedback = 'NOT CHARGED';\n        if (_lives <= 0) _finish('GRID FAILED');",
              "      } else {\n        _lives -= 1;\n        _feedback = 'NOT CHARGED';\n        unawaited(ReactAudio.play(ReactSoundCue.lifeLost));\n        if (_lives <= 0) _finish('GRID FAILED');",
          )
          replace_once(
              wave,
              "    setState(() => _memoryFlash = _memorySequence[index]);\n    _phaseTimer = Timer(const Duration(milliseconds: 410), () {",
              "    setState(() => _memoryFlash = _memorySequence[index]);\n    unawaited(ReactAudio.play(ReactSoundCue.command));\n    _phaseTimer = Timer(const Duration(milliseconds: 410), () {",
          )
          replace_once(
              wave,
              "      _score += 1;\n      _memorySequence.add(_random.nextInt(4));\n      _feedback = 'REWIND +1';",
              "      _score += 1;\n      _memorySequence.add(_random.nextInt(4));\n      _feedback = 'REWIND +1';\n      unawaited(ReactAudio.play(ReactSoundCue.success));",
          )

          enhanced = 'lib/features/modes/presentation/enhanced_variant_run_screen.dart'
          replace_once(
              enhanced,
              "import 'package:flutter/material.dart';\n\nimport '../../../core/theme/react_colors.dart';",
              "import 'package:flutter/material.dart';\n\nimport '../../../core/audio/react_audio.dart';\nimport '../../../core/theme/react_colors.dart';",
          )
          replace_once(
              enhanced,
              "  void _startCountdown() {\n    _countdownTimer = Timer.periodic(const Duration(milliseconds: 650), (_) {\n      if (!mounted || _finished) return;\n      if (_countdown > 1) {\n        setState(() => _countdown -= 1);\n        return;\n      }\n      if (!_go) {\n        setState(() => _go = true);\n        return;\n      }\n      _countdownTimer?.cancel();\n      _beginRun();\n    });\n  }",
              "  void _startCountdown() {\n    unawaited(ReactAudio.play(ReactSoundCue.countdownTick));\n    _countdownTimer = Timer.periodic(const Duration(milliseconds: 650), (_) {\n      if (!mounted || _finished) return;\n      if (_countdown > 1) {\n        setState(() => _countdown -= 1);\n        unawaited(ReactAudio.play(ReactSoundCue.countdownTick));\n        return;\n      }\n      if (!_go) {\n        setState(() => _go = true);\n        unawaited(ReactAudio.play(ReactSoundCue.countdownGo));\n        return;\n      }\n      _countdownTimer?.cancel();\n      _beginRun();\n    });\n  }",
          )
          replace_once(
              enhanced,
              "    _roundClock\n      ..reset()\n      ..start();\n    setState(() => _accepting = true);",
              "    _roundClock\n      ..reset()\n      ..start();\n    setState(() => _accepting = true);\n    unawaited(ReactAudio.play(ReactSoundCue.command));",
          )
          replace_once(
              enhanced,
              "    _maxStreak = max(_maxStreak, _streak);\n    setState(() => _feedback = '+1 CLEAR');",
              "    _maxStreak = max(_maxStreak, _streak);\n    unawaited(ReactAudio.play(ReactSoundCue.success));\n    setState(() => _feedback = '+1 CLEAR');",
          )
          replace_once(
              enhanced,
              "    _streak = 0;\n    _lives -= 1;\n    if (_lives <= 0) {",
              "    _streak = 0;\n    _lives -= 1;\n    unawaited(ReactAudio.play(ReactSoundCue.lifeLost));\n    if (_lives <= 0) {",
          )
          replace_once(
              enhanced,
              "    setState(() => _memoryFlash = _memorySequence[index]);\n    _phaseTimer = Timer(const Duration(milliseconds: 420), () {",
              "    setState(() => _memoryFlash = _memorySequence[index]);\n    unawaited(ReactAudio.play(ReactSoundCue.command));\n    _phaseTimer = Timer(const Duration(milliseconds: 420), () {",
          )
          replace_once(
              enhanced,
              "    _memorySequence.add(_random.nextInt(4));\n    setState(() => _feedback = 'CHAIN +1');",
              "    _memorySequence.add(_random.nextInt(4));\n    unawaited(ReactAudio.play(ReactSoundCue.success));\n    setState(() => _feedback = 'CHAIN +1');",
          )
          replace_once(
              enhanced,
              "    _countdownTimer?.cancel();\n    _roundClock.stop();\n    final newBest = await LocalVariantModeStats.record(mode, _score);",
              "    _countdownTimer?.cancel();\n    _roundClock.stop();\n    unawaited(ReactAudio.play(ReactSoundCue.completed));\n    final newBest = await LocalVariantModeStats.record(mode, _score);",
          )

          mosaic = 'lib/features/modes/presentation/mosaic_pressure_run_screen.dart'
          replace_once(
              mosaic,
              "import 'package:shared_preferences/shared_preferences.dart';\n\nimport '../../../core/theme/react_colors.dart';",
              "import 'package:shared_preferences/shared_preferences.dart';\n\nimport '../../../core/audio/react_audio.dart';\nimport '../../../core/theme/react_colors.dart';",
          )
          replace_once(
              mosaic,
              "    _randomizeRates();\n    _countdownTimer = Timer.periodic(const Duration(milliseconds: 650), (_) {\n      if (!mounted || _finished) return;\n      if (_countdown > 1) {\n        setState(() => _countdown -= 1);\n      } else if (!_go) {\n        setState(() => _go = true);\n      } else {\n        _countdownTimer?.cancel();\n        setState(() => _running = true);\n        _ticker = Timer.periodic(_tick, _onTick);\n      }\n    });",
              "    _randomizeRates();\n    unawaited(ReactAudio.play(ReactSoundCue.countdownTick));\n    _countdownTimer = Timer.periodic(const Duration(milliseconds: 650), (_) {\n      if (!mounted || _finished) return;\n      if (_countdown > 1) {\n        setState(() => _countdown -= 1);\n        unawaited(ReactAudio.play(ReactSoundCue.countdownTick));\n      } else if (!_go) {\n        setState(() => _go = true);\n        unawaited(ReactAudio.play(ReactSoundCue.countdownGo));\n      } else {\n        _countdownTimer?.cancel();\n        setState(() => _running = true);\n        unawaited(ReactAudio.play(ReactSoundCue.command));\n        _ticker = Timer.periodic(_tick, _onTick);\n      }\n    });",
          )
          replace_once(
              mosaic,
              "      _rates[index] = .0018 + _random.nextDouble() * .0038;\n      _score += 1;\n    });",
              "      _rates[index] = .0018 + _random.nextDouble() * .0038;\n      _score += 1;\n    });\n    unawaited(ReactAudio.play(ReactSoundCue.success));",
          )
          replace_once(
              mosaic,
              "    _finished = true;\n    _ticker?.cancel();\n    final prefs = await SharedPreferences.getInstance();",
              "    _finished = true;\n    _ticker?.cancel();\n    unawaited(ReactAudio.play(ReactSoundCue.completed));\n    final prefs = await SharedPreferences.getInstance();",
          )

          random_target = 'lib/features/modes/presentation/random_target_run_screen.dart'
          replace_once(
              random_target,
              "    _roundClock\n      ..reset()\n      ..start();\n    _lastTickElapsed = Duration.zero;",
              "    _roundClock\n      ..reset()\n      ..start();\n    _lastTickElapsed = Duration.zero;\n    unawaited(ReactAudio.play(ReactSoundCue.command));",
          )
          replace_once(
              random_target,
              "    unawaited(ReactAudio.play(ReactSoundCue.miss));",
              "    unawaited(ReactAudio.play(ReactSoundCue.lifeLost));",
          )
          replace_once(
              random_target,
              "    _countdownTimer?.cancel();\n    _roundClock.stop();\n\n    final newBest = await LocalVariantModeStats.record(mode, _score);",
              "    _countdownTimer?.cancel();\n    _roundClock.stop();\n    unawaited(ReactAudio.play(ReactSoundCue.completed));\n\n    final newBest = await LocalVariantModeStats.record(mode, _score);",
          )

          test_path = Path('test/mode_lab_audio_wiring_test.dart')
          test_path.write_text("""import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  test('Mode Lab run engines stay wired to central audio cues', () {
    final waveTwo = File(
      'lib/features/modes/presentation/wave_two_variant_run_screen.dart',
    ).readAsStringSync();
    final enhanced = File(
      'lib/features/modes/presentation/enhanced_variant_run_screen.dart',
    ).readAsStringSync();
    final pressureGrid = File(
      'lib/features/modes/presentation/mosaic_pressure_run_screen.dart',
    ).readAsStringSync();
    final randomTarget = File(
      'lib/features/modes/presentation/random_target_run_screen.dart',
    ).readAsStringSync();

    for (final source in [waveTwo, enhanced]) {
      expect(source, contains("../../../core/audio/react_audio.dart"));
      expect(source, contains('ReactSoundCue.countdownTick'));
      expect(source, contains('ReactSoundCue.countdownGo'));
      expect(source, contains('ReactSoundCue.command'));
      expect(source, contains('ReactSoundCue.success'));
      expect(source, contains('ReactSoundCue.lifeLost'));
      expect(source, contains('ReactSoundCue.completed'));
    }

    expect(pressureGrid, contains("../../../core/audio/react_audio.dart"));
    expect(pressureGrid, contains('ReactSoundCue.countdownTick'));
    expect(pressureGrid, contains('ReactSoundCue.countdownGo'));
    expect(pressureGrid, contains('ReactSoundCue.command'));
    expect(pressureGrid, contains('ReactSoundCue.success'));
    expect(pressureGrid, contains('ReactSoundCue.completed'));

    expect(randomTarget, contains('ReactSoundCue.command'));
    expect(randomTarget, contains('ReactSoundCue.success'));
    expect(randomTarget, contains('ReactSoundCue.lifeLost'));
    expect(randomTarget, contains('ReactSoundCue.completed'));
  });
}
""")

      - name: Commit audio pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/modes/presentation test/mode_lab_audio_wiring_test.dart
          git diff --cached --check
          git commit -m "Wire Mode Lab audio feedback"
          git push
