name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply guarded cosmetic quality patch once
        if: github.event_name == 'pull_request' && github.head_ref == 'seasonal-battle-pass'
        shell: bash
        run: |
          if grep -q "icon: Icons.workspace_premium_rounded" lib/features/player/presentation/player_profile_screen.dart; then
            python .github/scripts/apply_cosmetic_quality_patch.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/features/player/presentation/player_profile_screen.dart \
                    lib/features/results/presentation/results_screen.dart \
                    lib/features/season/presentation/season_reward_preview.dart
            git commit -m "Strengthen cosmetic identity and Results treatments"
            git push origin HEAD:seasonal-battle-pass
          else
            echo "Cosmetic quality patch already applied; skipping."
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: react-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
